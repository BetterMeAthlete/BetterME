<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heartwork Academy | Keaton Cole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght=400;600;700;800&display=swap');

        body { 
            font-family: 'Inter', sans-serif; 
            background: #0a2e6b;
            background: linear-gradient(to bottom, #0a2e6b 0%, #000a1a 100%);
            color: #ffffff; 
            margin: 0; 
            padding-bottom: 120px; 
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        /* Sticky Bottom Navigation Layout */
        nav { 
            background: #000a1a;
            background: rgba(0, 10, 26, 0.95); 
            padding: 20px 0; 
            display: flex; 
            justify-content: space-around; 
            position: fixed; 
            top: auto;
            bottom: 0; 
            left: 0;
            right: 0;
            z-index: 1000; 
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: none;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        nav a { 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 12px; 
            text-transform: uppercase; 
            opacity: 0.7; 
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }
        nav a:hover, nav a.active-tab { 
            opacity: 1; 
            color: #d4af37; 
        }

        .tab-content { 
            display: none; 
            padding: 20px; 
            max-width: 700px; 
            margin: 0 auto; 
        }

        .hero-section { text-align: center; padding: 40px 20px; }
        .main-logo { width: 100%; max-width: 360px; height: auto; margin: 0 auto; display: block;}

            background: linear-gradient(135deg, #d4af37 0%, #f9d976 50%, #b8860b 100%); 
            color: #000000; 
            padding: 14px 25px; 
            text-decoration: none !important; 
            font-weight: 800; 
            border-radius: 50px; 
            display: inline-block;
            text-align: center; 
            border: none;
