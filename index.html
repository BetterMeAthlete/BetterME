<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartwork Academy</title>
<style>
  /* --- BULLETPROOF DARK CORE RESET --- */
  html, body {
    background-color: #0d0d0d !important;
    color: #ffffff !important;
    margin: 0;
    padding: 0;
    font-family: sans-serif;
  }
  
  /* --- CONTAINER LIMITS --- */
  .app-layout-wrapper {
    max-width: 800px;
    margin: 0 auto;
    padding: 15px;
  }

  /* --- BRANDING HEADER --- */
  .app-main-header {
    background-color: #161616;
    border-bottom: 2px solid #ff5722;
    padding: 20px;
    text-align: center;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .app-main-header h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 1px;
  }
  .app-main-header span {
    color: #ff5722;
  }

  /* --- NAVIGATION BUTTONS GRID --- */
  .navigation-grid-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 25px;
  }
  .nav-action-button {
    background-color: #1c1c1c;
    border: 1px solid #333333;
    color: #aaaaaa;
    padding: 12px 4px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .nav-action-button.active-tab {
    color: #ffffff;
    border-color: #ff5722;
    background-color: rgba(255, 87, 34, 0.1);
  }

  /* --- CARD INTERACTIVE VIEWPORTS --- */
  .content-display-panel {
    display: none;
  }
  .content-display-panel.visible-panel {
    display: block;
  }

  /* --- LOCKER ROOM MOTIVATION --- */
  .motivation-hero-box {
    background: #1c1c1c;
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    border: 1px solid #2d2d2d;
  }
  .motivation-hero-box p {
    font-size: 18px;
    line-height: 1.5;
    font-style: italic;
  }

  /* --- LIVE EVENTS DROPDOWN SYSTEM --- */
  .event-clickable-trigger {
    width: 100%;
    background: #1c1c1c;
    border: 2px solid #ff5722;
    border-radius: 10px;
    padding: 18px;
    color: #ffffff;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dropdown-revealed-box {
    background: #141414;
    border: 2px solid #ff5722;
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 20px 15px;
    margin-top: -2px;
  }
  .flyer-img-frame img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin-bottom: 20px;
  }
  .speakers-double-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .individual-speaker-card {
    background: #222;
    padding: 12px;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #333;
  }
  .speaker-round-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto 10px auto;
    overflow: hidden;
    border: 2px solid #ff5722;
  }
  .speaker-round-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* SCHEDULE rows */
  .itinerary-schedule-container {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .schedule-row-item {
    display: flex;
    padding: 8px 0;
    border-bottom: 1px solid #2a2a2a;
    font-size: 14px;
  }
  .badge-label {
    width: 130px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    text-align: center;
  }

  /* GREEN SURVEY CARD */
  .standalone-survey-square {
    display: block;
    background: linear-gradient(135deg, #112015 0%, #09120c 100%);
    border: 2px solid #2e7d32;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    text-decoration: none;
    color: #ffffff;
  }

  /* --- VAULT CARD BOXES --- */
  .vault-squares-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
  }
  .vault-interactive-square {
    background: #1c1c1c;
    border-left: 4px solid #ff5722;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
  }

  /* --- ACADEMY OUTLINK BLOCK --- */
  .academy-portal-frame {
    background: #1c1c1c;
    border: 1px solid #ff5722;
    border-radius: 12px;
    padding: 30px 15px;
    text-align: center;
  }
  .academy-portal-frame a {
    display: inline-block;
    background: #ff5722;
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    font-weight: bold;
    border-radius: 6px;
    margin: 15px 0;
  }
</style>
</head>
