<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heartwork Academy | Keaton Cole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght=400;600;800&display=swap');
        
        :root {
            --sapphire-top: #0a2e6b;
            --sapphire-bottom: #000a1a;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9d976 50%, #b8860b 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-gold: #d4af37;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(to bottom, var(--sapphire-top), var(--sapphire-bottom));
            color: white; 
            margin: 0; 
            padding-bottom: 100px;
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        nav { 
            background: rgba(0, 10, 26, 0.95); 
            padding: 1.2rem 0; 
            display: flex; 
            justify-content: space-around; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(15px);
        }

        nav a { color: #fff; text-decoration: none; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; opacity: 0.6; cursor: pointer; }
        nav a:hover { opacity: 1; color: var(--text-gold); }

        /* CORE TAB MASTER RULES */
        .tab-content { display: none; padding: 20px; max-width: 600px; margin: auto; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* HERO LOGO CONTAINER */
        .hero-section { 
            text-align: center; 
            padding: 50px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HERO LOGO */
        .main-logo { 
            width: 100%; 
            max-width: 360px; 
            height: auto; 
            margin: 0 auto; 
            display: block;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
        }

        .btn-gold { 
            background: var(--gold-gradient); 
            color: #000; 
            padding: 18px 25px; 
            text-decoration: none !important; 
            font-weight: 800; 
            border-radius: 50px; 
            display: block; 
            width: 90%; 
            margin: 20px auto; 
            text-align: center; 
            border: none; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            letter-spacing: 1.5px;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); 
            cursor: pointer;
            box-sizing: border-box; 
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            text-align: center; 
        }
