<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heartwork Academy | Keaton Cole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght=400;600;700;800&display=swap');

        body { 
            font-family: 'Inter', sans-serif; 
            background: #0a2e6b;
            background: linear-gradient(to bottom, #0a2e6b 0%, #000a1a 100%);
            color: #ffffff; 
            margin: 0; 
            padding-bottom: 100px;
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        nav { 
            background: #000a1a;
            background: rgba(0, 10, 26, 0.95); 
            padding: 20px 0; 
            display: flex; 
            justify-content: space-around; 
            position: -webkit-sticky;
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        nav a { 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 13px; 
            text-transform: uppercase; 
            opacity: 0.7; 
        }
        nav a:hover { 
            opacity: 1; 
            color: #d4af37; 
        }

        .tab-content { 
            display: none; 
            padding: 20px; 
            max-width: 700px; 
            margin: 0 auto; 
        }

        #locker-room { display: block; }
        body:has(:target) #locker-room { display: none; }
        :target { display: block !important; }

        .hero-section { text-align: center; padding: 40px 20px; }
        .main-logo { width: 100%; max-width: 360px; height: auto; margin: 0 auto; display: block;}

        .btn-gold { 
            background: #d4af37;
            background: linear-gradient(135deg, #d4af37 0%, #f9d976 50%, #b8860b 100%); 
            color: #000000; 
            padding: 14px 25px; 
            text-decoration: none !important; 
            font-weight: 800; 
            border-radius: 50px; 
            display: inline-block;
            text-align: center; 
            border: none; 
            text-transform: uppercase; 
            font-size: 11px; 
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .card { 
            background: rgba(255, 255, 255, 0.08); 
            padding: 30px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        .lms-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
            margin-top: 25px;
            text-align: left;
        }

        .lms-sidebar {
            background: rgba(0, 10, 26, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .lms-phase-title {
            font-size: 10px;
            font-weight: 800;
            color: #ff8033;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 8px 0;
            padding-left: 4px;
        }
        .lms-phase-title:first-child { margin-top: 0; }

        .lms-nav-item {
            display: block;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lms-nav-item:hover { background: rgba(212, 175, 55, 0.1); color: #fff; }
        .lms-nav-item.active-lesson { background: #d4af37 !important; color: #000000 !important; font-weight: 800; border-color: #d4af37; }

        .lms-player-window {
            background: #000a1a;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .video-placeholder {
            background: linear-gradient(135deg, #001f4d 0%, #0a2e6b 100%);
            padding: 45px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .video-play-icon {
            width: 44px;
            height: 44px;
            background: rgba(212,175,55,0.15);
            border: 2px solid #d4af37;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 16px;
        }

        .bullet-list { margin: 10px 0 15px 0; padding-left: 20px; color: rgba(255,255,255,0.85); font-size: 13px; line-height: 1.65; }
        .bullet-list li { margin-bottom: 6px; }
        .section-divider { border-top: 1px solid rgba(212, 175, 55, 0.2); margin: 40px 0 20px 0; padding-top: 20px; }
        .workshop-details { text-align: left; border-top: 1px solid rgba(255, 255, 255, 0.15); padding: 25px 30px 30px 30px; background: rgba(0, 0, 0, 0.15); }
        .speaker-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .speaker-box { background: rgba(0, 0, 0, 0.2); border-radius: 15px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .speaker-headshot { width: 85px; height: 85px; margin: 0 auto 12px auto; border-radius: 50%; background-size: cover; background-position: center; border: 3px solid #d4af37; }
        .rundown-item { display: flex; align-items: center; margin-bottom: 14px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 8px; border-left: 4px solid #e65c00; }
        .rundown-time { padding: 10px; font-weight: 800; font-size: 13px; min-width: 115px; color: #ff8033; text-align: center; }
        .rundown-block { flex-grow: 1; background: linear-gradient(135deg, #d4af37 0%, #f9d976 50%, #b8860b 100%); color: #000000; padding: 12px 15px; border-radius: 10px; font-weight: 800; font-size: 13px; text-transform: uppercase; }

        @media (max-width: 768px) {
            .lms-layout { grid-template-columns: 1fr; }
            .lms-sidebar { max-height: 180px; }
            .rundown-item { flex-direction: column; align-items: flex-start; padding: 12px; }
            .rundown-time { padding: 0 0 8px 4px; text-align: left; min-width: auto; }
            .rundown-block { width: 100%; box-sizing: border-box; text-align: left; }
            .speaker-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>

    <a href="#academy">Academy</a>
    <a href="#events">Events</a>
    <a href="#store">The Vault</a>
</nav>

        <p style="font-size: 14px; opacity: 0.6; margin: 0 0 20px 0;">A 4-Minute Blueprint on Mental Grit by Coach Keaton Cole</p>
